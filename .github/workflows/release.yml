# Push a v* tag to build the Android arm64 artifacts and publish them to a GitHub Release.
# The build itself is the repository's own ./build.sh; toolchain discovery (sdk.env.sh) reads
# ANDROID_HOME, so this workflow only has to provision the SDK packages pinned in the README:
# platforms;android-36, build-tools;36.0.0, ndk;28.1.13356709, plus JDK and a Rust target.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build shell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs cmdline-tools, accepts licenses, and exports ANDROID_HOME.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The old SDK "tools" package in the action's default list is no longer available.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install SDK packages (pinned versions from sdk.env.sh / build.sh)
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.1.13356709"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build
        run: ./build.sh

      - name: Package
        run: |
          dist="ij2art-${GITHUB_REF_NAME}-android-arm64"
          mkdir -p "dist/$dist"
          cp out/ij2art out/ij2art-hook-api.jar out/THIRD_PARTY_NOTICES.txt "dist/$dist/"
          cp tools/hookproj.py "dist/$dist/"
          cp out/ij2art dist/ij2art-android-arm64
          tar -czf "dist/$dist.tar.gz" -C dist "$dist"
          (cd dist && sha256sum "$dist.tar.gz" > "$dist.tar.gz.sha256")
          (cd dist && sha256sum ij2art-android-arm64 > ij2art-android-arm64.sha256)

      - name: Detect prerelease
        id: rel
        run: |
          if [[ "$GITHUB_REF_NAME" =~ -(alpha|beta|rc)[0-9]*$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ij2art-android-arm64
            dist/*.tar.gz
            dist/*.sha256
          prerelease: ${{ steps.rel.outputs.prerelease }}
          generate_release_notes: true
